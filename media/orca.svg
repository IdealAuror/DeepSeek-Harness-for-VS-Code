<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    DeepSeek 风格虎鲸:浑圆的身体 + 上扬粗尾 + 背鳍 / 胸鳍,单一品牌蓝、极简无描边;
    眼斑为留白(含黑瞳)。活动栏按 alpha 蒙版着色(可见=主题图标色,留白=背景色),
    因此同一份 SVG 在活动栏是主题色剪影、在视图标题里是品牌蓝虎鲸。
  -->
  <!-- 尾:从左下上扬的粗笔画 -->
  <path fill="#4D6BFE" d="M7.4 18.6C5 17.5 3.4 15.5 2.8 13.2c-.2-.8.4-1.5 1.2-1.5.6 0 1.1.4 1.3.9.4 1.5 1.4 2.7 2.8 3.4.7.3 1 1.1.7 1.7-.3.6-1 1-1.4.9z"/>
  <!-- 二叶尾鳍:与尾部衔接的 V 形 -->
  <path fill="#4D6BFE" d="M4.4 19.6c-1.6-1.3-2.8-3-3.4-4.9-.2-.6-.9-.9-1.4-.7-.6.2-.9.9-.7 1.4.8 2.4 2.3 4.5 4.4 6 .5.4 1.3.3 1.7-.2.4-.5.2-1.3-.6-1.6z"/>
  <!-- 身体:浑圆 -->
  <ellipse cx="14.6" cy="12.4" rx="8.2" ry="7.8" fill="#4D6BFE"/>
  <!-- 背鳍 -->
  <path fill="#4D6BFE" d="M12.4 5.2c.6-2.2 2.3-4 4.4-4.7.7-.2 1.4.4 1.3 1.1-.1.5-.4.9-.9 1-1.4.5-2.5 1.6-3 3-.2.6-.8 1-1.4.8-.6-.2-.6-.7-.4-1.2z"/>
  <!-- 胸鳍 -->
  <path fill="#4D6BFE" d="M19.4 17.8c1.3 1.5 2 3.4 2.1 5.4 0 .6-.5 1.1-1.1 1.1-.5 0-.9-.4-1-1-.1-1.5-.6-2.9-1.5-4.1-.4-.5-.3-1.2.2-1.6.5-.3 1-.1 1.3.2z"/>
  <!-- 眼斑(留白)+ 瞳孔 -->
  <ellipse cx="16.6" cy="9.6" rx="3.2" ry="2.2" transform="rotate(-20 16.6 9.6)" fill="#ffffff"/>
  <circle cx="17.5" cy="10.3" r="1.2" fill="#4D6BFE"/>
</svg>
